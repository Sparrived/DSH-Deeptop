name: CI

on:
  push:
    branches:
      - main
      - master
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: 22.19.0

jobs:
  frontend:
    name: Frontend build and tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          submodules: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Prepare patched DSH source
        run: node scripts/prepare-dsh-source.mjs

      - name: Install npm dependencies
        run: npm ci

      - name: Enable Corepack for DSH source build
        run: corepack enable

      - name: Check synchronized application version
        run: npm run version:check

      - name: Build frontend
        run: npm run build

      - name: Build and verify embedded DSH runtime
        run: npm run dsh:sync && npm run dsh:verify

      - name: Upload frontend build artifact
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist-${{ github.sha }}
          path: dist
          if-no-files-found: error
          retention-days: 7

      - name: Run JavaScript tests
        run: npm test

  rust:
    name: Rust checks
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          submodules: false

      - name: Set up Node.js for Tauri resource generation
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Prepare patched DSH source
        run: node scripts/prepare-dsh-source.mjs

      - name: Install npm dependencies
        run: npm ci

      - name: Enable Corepack for DSH source build
        run: corepack enable

      - name: Build and verify embedded DSH runtime
        run: npm run dsh:sync && npm run dsh:verify

      - name: Install Tauri Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            build-essential \
            curl \
            file \
            libayatana-appindicator3-dev \
            libssl-dev \
            libwebkit2gtk-4.1-dev \
            libxdo-dev \
            librsvg2-dev \
            patchelf

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Check Rust formatting
        working-directory: src-tauri
        run: cargo fmt --all -- --check

      - name: Check Rust compilation
        working-directory: src-tauri
        run: cargo check --locked

      - name: Run Rust tests
        working-directory: src-tauri
        run: cargo test --locked

      - name: Run Clippy
        working-directory: src-tauri
        run: cargo clippy --locked --all-targets -- -D warnings

  desktop-linux:
    name: Linux desktop bundle smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          submodules: false

      - name: Install Tauri Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            build-essential \
            curl \
            file \
            libayatana-appindicator3-dev \
            libssl-dev \
            libwebkit2gtk-4.1-dev \
            libxdo-dev \
            librsvg2-dev \
            patchelf

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Prepare patched DSH source
        run: node scripts/prepare-dsh-source.mjs

      - name: Install npm dependencies
        run: npm ci

      - name: Enable Corepack for DSH source build
        run: corepack enable

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Build and verify embedded DSH runtime
        run: npm run dsh:sync && npm run dsh:verify

      - name: Build Linux Debian bundle
        run: npm run tauri -- build --bundles deb --ci --no-sign

      - name: Upload Linux bundle smoke-test artifact
        uses: actions/upload-artifact@v4
        with:
          name: linux-deb-${{ github.sha }}
          path: src-tauri/target/release/bundle/deb/*.deb
          if-no-files-found: error
          retention-days: 7
