name: Release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      tag:
        description: "要发布的版本 Tag（例如 v0.1.1-dev.1）"
        required: true
        type: string
      release_channel:
        description: "发布通道；auto 按 Tag 自动判断"
        required: true
        default: auto
        type: choice
        options:
          - auto
          - development
          - stable

permissions:
  contents: read

env:
  NODE_VERSION: 22.19.0

concurrency:
  group: release-${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  prepare:
    name: Validate release version
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      tag: ${{ steps.version.outputs.tag }}
      version: ${{ steps.version.outputs.version }}
      prerelease: ${{ steps.version.outputs.prerelease }}
      channel: ${{ steps.version.outputs.channel }}
    steps:
      - name: Check out release ref
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install npm dependencies
        run: npm ci

      - name: Run JavaScript tests
        run: npm test

      - name: Validate tag and synchronized manifests
        id: version
        shell: bash
        env:
          RELEASE_EVENT: ${{ github.event_name }}
          INPUT_TAG: ${{ inputs.tag }}
          INPUT_CHANNEL: ${{ inputs.release_channel }}
          PUSH_TAG: ${{ github.ref_name }}
        run: |
          if [[ "$RELEASE_EVENT" == "workflow_dispatch" ]]; then
            tag="$INPUT_TAG"
            requested_channel="${INPUT_CHANNEL:-auto}"
          else
            tag="$PUSH_TAG"
            requested_channel="auto"
          fi

          if [[ ! "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z-]+(\.[0-9A-Za-z-]+)*)?(\+[0-9A-Za-z-]+(\.[0-9A-Za-z-]+)*)?$ ]]; then
            echo "Release tag must be v<SemVer>, for example v0.1.1-dev.1: $tag" >&2
            exit 1
          fi
          if [[ "$requested_channel" != "auto" && "$requested_channel" != "development" && "$requested_channel" != "stable" ]]; then
            echo "Unsupported release channel: $requested_channel" >&2
            exit 1
          fi

          version="${tag#v}"
          npm run version:check -- "$version"
          if [[ "$version" == *-* ]]; then
            prerelease=true
            detected_channel=development
          else
            prerelease=false
            detected_channel=stable
          fi
          if [[ "$requested_channel" != "auto" && "$requested_channel" != "$detected_channel" ]]; then
            echo "Tag $tag belongs to $detected_channel, not requested channel $requested_channel" >&2
            exit 1
          fi

          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "prerelease=$prerelease" >> "$GITHUB_OUTPUT"
          echo "channel=$detected_channel" >> "$GITHUB_OUTPUT"
          echo "Validated $tag as $detected_channel release"

  build:
    name: Build ${{ matrix.platform }} (${{ matrix.arch }})
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows
            arch: x64
            runner: windows-latest
            bundles: nsis,msi
            development_bundles: nsis
          - platform: linux
            arch: x64
            runner: ubuntu-22.04
            bundles: deb,appimage
          - platform: macos
            arch: x64
            runner: macos-14
            bundles: dmg
          - platform: macos
            arch: arm64
            runner: macos-14
            bundles: dmg
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    steps:
      - name: Check out release ref
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.tag }}
          submodules: recursive

      - name: Install Linux dependencies
        if: matrix.platform == 'linux'
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          sudo apt-get -o Acquire::Retries=3 install --no-install-recommends -y \
            build-essential \
            file \
            libayatana-appindicator3-dev \
            libssl-dev \
            libwebkit2gtk-4.0-dev \
            libsoup-3.0-dev \
            libxdo-dev \
            librsvg2-dev \
            patchelf

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install npm dependencies
        run: npm ci

      - name: Enable Corepack for DSH source build
        run: corepack enable

      - name: Check synchronized application version
        run: npm run version:check -- "${{ needs.prepare.outputs.version }}"

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Build and verify embedded DSH runtime
        run: npm run dsh:sync && npm run dsh:verify

      - name: Clear Linux Rust build artifacts
        if: matrix.platform == 'linux'
        run: cargo clean --manifest-path src-tauri/Cargo.toml

      - name: Build Tauri bundles
        run: npm run tauri -- build --bundles ${{ needs.prepare.outputs.prerelease == 'true' && matrix.development_bundles || matrix.bundles }} --ci --no-sign

      - name: Collect release assets
        run: node scripts/collect-release-assets.mjs --version "${{ needs.prepare.outputs.version }}" --platform "${{ matrix.platform }}" --arch "${{ matrix.arch }}"

      - name: Upload platform assets
        uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.platform }}-${{ matrix.arch }}
          path: release-assets/*
          if-no-files-found: error
          retention-days: 14

  publish:
    name: Publish GitHub Release
    needs:
      - prepare
      - build
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Download release assets
        uses: actions/download-artifact@v4
        with:
          pattern: release-*
          path: release-assets
          merge-multiple: true

      - name: Create checksums
        working-directory: release-assets
        run: sha256sum -- * > SHA256SUMS

      - name: Check out release history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ needs.prepare.outputs.tag }}
          submodules: recursive
          path: release-source

      - name: Set up Node.js for release notes
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Generate categorized release notes
        working-directory: release-source
        env:
          TAG: ${{ needs.prepare.outputs.tag }}
          VERSION: ${{ needs.prepare.outputs.version }}
        run: node scripts/generate-release-notes.mjs --tag "$TAG" --version "$VERSION" --output "$GITHUB_WORKSPACE/release-notes.md"

      - name: Create or update GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.prepare.outputs.tag }}
          VERSION: ${{ needs.prepare.outputs.version }}
          PRERELEASE: ${{ needs.prepare.outputs.prerelease }}
          CHANNEL: ${{ needs.prepare.outputs.channel }}
        run: |
          if [[ "$PRERELEASE" == "true" ]]; then
            title="Deeptop $VERSION (Development)"
            release_flags=(--prerelease)
          else
            title="Deeptop $VERSION"
            release_flags=()
          fi

          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$TAG" release-assets/* --repo "$GITHUB_REPOSITORY" --clobber
            gh release edit "$TAG" \
              --repo "$GITHUB_REPOSITORY" \
              --title "$title" \
              --notes-file "$GITHUB_WORKSPACE/release-notes.md" \
              --prerelease="$PRERELEASE"
          else
            gh release create "$TAG" release-assets/* \
              --repo "$GITHUB_REPOSITORY" \
              --title "$title" \
              --notes-file "$GITHUB_WORKSPACE/release-notes.md" \
              --verify-tag \
              "${release_flags[@]}"
          fi
          echo "Published $CHANNEL release $TAG"
