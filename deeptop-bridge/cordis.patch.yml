# Native desktop surface for DSH. This is a profile layer, not an external
# service: the bridge shares the same Cordis tree as agents, sessions, tools,
# model adapters, and any bundles added to the desktop profile.

- id: system-prompt
  config:
    persona: >-
      You are a coding agent powered by the {{model}} model. Your working directory is {{cwd}}.

- id: tools
  config:
    mode: !!js process.env.DSH_TOOLS_MODE

- insert:
    - id: code-runtime
      name: '@deepseek-ai/dsh-code-runtime-worker-thread'

    - id: storage
      name: '@deepseek-ai/dsh-storage'

    - id: storage-json
      name: '@deepseek-ai/dsh-storage-json'
      config:
        root: !!js dshHomePath('storages')

    - id: storage-domain
      name: '@deepseek-ai/dsh-storage-domain'
      config:
        backend: json

    - id: message-feedback
      name: '@deepseek-ai/dsh-message-feedback'
      config:
        maxNoteBytes: 8192

    - id: message-annotations
      name: 'deeptop-bridge/message-annotations'

    - id: session-stats
      name: '@deepseek-ai/dsh-session-stats'

    - id: workspace
      name: '@deepseek-ai/dsh-workspace'

    - id: session-projection-cache
      name: '@deepseek-ai/dsh-session-projection-cache'
      config:
        writeEveryEvents: 200
        writeIntervalMs: 5000

    - id: directory-picker
      name: '@deepseek-ai/dsh-host-directory-picker-native'

    - id: plugin-inventory
      name: '@deepseek-ai/dsh-host-plugin-inventory'

    - id: api-gateway
      name: '@deepseek-ai/dsh-host-apiproxy'
      config:
        nativeOpen: true

    - id: cordis-host-runner
      name: '@deepseek-ai/dsh-cordis-host-runner'

    - id: agent-presets
      name: '@deepseek-ai/dsh-agent-presets'
      config:
        default: standard

    - id: file-reference-local
      name: '@deepseek-ai/dsh-file-reference-local'

    - id: session-reference
      name: '@deepseek-ai/dsh-session-reference'

    - id: desktop-bridge
      name: 'deeptop-bridge'

    - id: skill-installer
      name: 'deeptop-bridge/skill-install-plugin'

# The desktop surface uses the same per-session agent-preset arrangement as
# the web surface. Host services remain shared; each session gets its own
# model-facing tools and prompt composition. Skill installation is a separate
# host plugin so it can be disabled without stopping the desktop bridge.
- id: tool-bash
  disabled: true

- id: tool-pwsh
  disabled: true

- id: tool-jobs
  disabled: true

- id: tool-fs
  disabled: true

- id: tool-fs-search
  disabled: true

- id: tool-str-replace-editor
  disabled: true

- id: skill-filesystem
  disabled: true

- id: tool-skill
  disabled: true

- id: tool-goal
  disabled: true

- id: plan-mode
  disabled: true

- id: compaction-basic
  disabled: true

- id: command-compact
  disabled: true

- id: tool-result-pruner
  disabled: true

- id: tool-subagent-control
  disabled: true

- id: tool-subagent-list-agents
  disabled: true

- id: tool-subagent
  disabled: true

- id: tool-subagent-fork
  disabled: true

- id: workflow-worker-thread
  disabled: true

- id: tool-workflow
  disabled: true

- id: tool-ralph
  disabled: true

- id: agent-instructions
  disabled: true

- id: tool-todo
  disabled: true

- id: tool-web
  disabled: true
