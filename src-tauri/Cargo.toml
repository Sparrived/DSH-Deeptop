[package]
name = "deeptop"
version = "0.1.2-dev.2"
description = "Native desktop client for DeepSeek Harness"
authors = ["Deeptop"]
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = [] }
tauri-plugin-single-instance = "2.4.3"
notify-rust = "4.18.0"
rfd = "0.15"
