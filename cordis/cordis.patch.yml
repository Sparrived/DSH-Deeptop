# Native desktop surface for DSH. This is a profile layer, not an external
# service: the bridge shares the same Cordis tree as agents, sessions, tools,
# model adapters, and any bundles added to the desktop profile.

- id: system-prompt
  config:
    personaPrefix: >-
      You are a coding agent powered by the {{model}} model.
    personaSuffix: >-
      Your working directory is {{cwd}}.

- id: tools
  config:
    mode: !!js process.env.DSH_TOOLS_MODE

- insert:
    - id: code-runtime
      name: '@deepseek-ai/dsh-code-runtime-worker-thread'

    - id: message-feedback
      name: '@deepseek-ai/dsh-message-feedback'
      config:
        maxNoteBytes: 8192

    - id: message-annotations
      name: 'deeptop-bridge/message-annotations'

    - id: session-pins
      name: 'deeptop-bridge/session-pins'

    - id: session-stats
      name: '@deepseek-ai/dsh-session-stats'

    # Whole-log turn outline projection (turnOutline unit) so the desktop can
    # list every started turn and target history paging at exact seqs.
    - id: session-turn-outline
      name: '@deepseek-ai/dsh-session-turn-outline'

    - id: theme-settings
      name: 'deeptop-bridge/theme-settings'

    - id: workspace
      name: '@deepseek-ai/dsh-workspace'

    - id: directory-picker
      name: '@deepseek-ai/dsh-host-directory-picker-native'

    - id: plugin-inventory
      name: '@deepseek-ai/dsh-host-plugin-inventory'

    # Alpha.2 file receipt storage registers a route through the official Host
    # connection service. Bind an unadvertised loopback socket; Deeptop does
    # not expose this transport or the fileUploads Remote to the renderer.
    - id: webserver
      name: '@deepseek-ai/dsh-host-webserver'
      config:
        host: 127.0.0.1
        port: 0

    - id: connection
      name: '@deepseek-ai/dsh-client-connection'

    # SessionController owns prompt receipt binding and requires fileUploads,
    # even though Deeptop currently exposes text and images only.
    - id: file-upload
      name: '@deepseek-ai/dsh-client-file-upload'

    # Session commands, cold reads, and live control over Typert Remote.
    - id: session-controller
      name: '@deepseek-ai/dsh-api-session-controller'

    # Configuration-surface reads and writes over Typert Remote. Each method
    # reports an actionable error when its settings-domain provider is absent.
    - id: settings-controller
      name: '@deepseek-ai/dsh-api-settings-controller'

    # Workspace commands and reconnect-safe projection over Typert Remote.
    - id: workspace-controller
      name: '@deepseek-ai/dsh-api-workspace-controller'

    # Host-scope backing for the standard/ptc preset's delegation composition
    # (tool-subagent mounts with modelSelectionSettings: true), mirroring the
    # web-app bundle's Host insertion.
    - id: subagent-model-selection-settings
      name: '@deepseek-ai/dsh-tool-subagent/model-selection-settings'

    # Per-route 「何时使用」说明：注入每个 Session 的 prompt 引导段（本插件拥有），
    # 并投影到声明了 models[].description 的 provider catalog。
    - id: subagent-routing
      name: 'deeptop-bridge/subagent-routing'

    - id: cordis-host-runner
      name: '@deepseek-ai/dsh-cordis-host-runner'

    - id: agent-presets
      name: '@deepseek-ai/dsh-agent-presets'
      config:
        default: standard

    - id: file-reference-local
      name: '@deepseek-ai/dsh-file-reference-local'

    - id: session-reference
      name: '@deepseek-ai/dsh-session-reference'

    - id: deeptop-ui-registry
      name: 'deeptop-bridge/ui-registry'

    - id: message-annotations-ui
      name: 'deeptop-bridge/message-annotations-ui'

    - id: desktop-bridge
      name: 'deeptop-bridge/desktop-bridge'

    - id: skill-installer
      name: 'deeptop-bridge/skill-installer'

# dsh-base 的 session-title-llm 以 64 为标题辅助请求的输出上限。标题正文只需十几
# token，但该上限与提供方的思考前导共用：部分网关默认开启思考且忽略客户端的
# thinking: disabled，上限被思考吃光后模型不再输出正文，自动标题以 max-tokens
# 失败，会话只能停在首条消息的确定性回退上。Deeptop 的模型多为这类网关，故在
# 桌面 Profile 层抬高上限（patch 整段替换 config，字段需写全）。
- id: session-title-llm
  config:
    targetWords: 5
    targetCjkCharacters: 10
    maxInputBytes: 4096
    maxOutputTokens: 2048
    timeoutMs: 60000

# The desktop surface uses the same per-session agent-preset arrangement as
# the web surface. Host services remain shared; each session gets its own
# model-facing tools and prompt composition. Skill installation is a separate
# host plugin so it can be disabled without stopping the desktop bridge.
- id: tool-bash
  disabled: true

- id: tool-pwsh
  disabled: true

- id: tool-jobs
  disabled: true

- id: tool-fs
  disabled: true

- id: tool-fs-search
  disabled: true

- id: skill-filesystem
  disabled: true

- id: tool-skill
  disabled: true

- id: tool-goal
  disabled: true

- id: plan-mode
  disabled: true

- id: compaction-basic
  disabled: true

- id: command-compact
  disabled: true

- id: tool-result-pruner
  disabled: true

- id: tool-subagent-control
  disabled: true

- id: tool-subagent-list-agents
  disabled: true

- id: tool-subagent
  disabled: true

- id: tool-subagent-fork
  disabled: true

- id: workflow-worker-thread
  disabled: true

- id: tool-workflow
  disabled: true

- id: tool-ralph
  disabled: true

- id: agent-instructions
  disabled: true

- id: tool-todo
  disabled: true

- id: tool-web
  disabled: true
